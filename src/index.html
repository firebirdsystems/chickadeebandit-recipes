<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg:    var(--hub-primary-fg, #fff);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
      --green: #059669; --amber: #d97706; --red: #dc2626;
      --amber-bg: #fffbeb; --amber-border: #fcd34d;
      --green-bg: #f0fdf4; --red-bg: #fef2f2;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg); color: var(--text);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }

    /* ── Two-pane layout ── */
    .layout { display: flex; height: 100%; overflow: hidden; }

    /* ── Left nav ── */
    .nav-pane {
      width: 200px; flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .nav-item {
      display: block; width: 100%; text-align: left; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      padding: 8px 16px; border: none; background: none;
      font-size: 0.875rem; font-family: inherit; color: var(--text);
      cursor: pointer; transition: background .12s;
    }
    .nav-item:hover { background: var(--border); }
    .nav-item.active { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
    .nav-item.active:hover { background: var(--accent-hover); }
    .nav-section {
      padding: 14px 16px 4px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
    }
    .nav-section-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 8px 4px 16px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
    }
    .nav-add-btn {
      background: none; border: none; color: var(--muted); font-size: 1.1rem; line-height: 1;
      cursor: pointer; width: 26px; height: 26px; border-radius: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; transition: background .12s, color .12s;
    }
    .nav-add-btn:hover { background: var(--border); color: var(--accent); }
    .cat-inline-form { padding: 6px 10px 10px; border-bottom: 1px solid var(--border); }
    .cat-inline-input {
      display: block; width: 100%; padding: 5px 8px; font-size: 0.83rem;
      border: 1.5px solid var(--border); border-radius: 6px;
      font-family: inherit; color: var(--text); background: var(--card); outline: none;
    }
    .cat-inline-input:focus { border-color: var(--accent); }
    .cat-inline-row { display: flex; gap: 5px; align-items: center; margin-top: 5px; }
    .nav-cat-row { display: flex; align-items: center; }
    .nav-cat-row .nav-item { flex: 1; min-width: 0; }
    .nav-cat-del {
      background: none; border: none; color: var(--muted); font-size: 0.9rem; line-height: 1;
      cursor: pointer; padding: 0 8px; opacity: 0; flex-shrink: 0; transition: opacity .12s, color .12s;
    }
    .nav-cat-row:hover .nav-cat-del { opacity: 1; }
    .nav-cat-del:hover { color: var(--red); }
    .cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex-shrink: 0; }
    .nav-divider { height: 1px; background: var(--border); margin: 6px 0; }

    /* ── Category checkboxes in form ── */
    .cat-checkboxes { display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow-y: auto; }
    .cat-check-label {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; user-select: none;
      transition: background .1s;
    }
    .cat-check-label:hover { background: var(--border); }
    .cat-check-label input[type=checkbox] { width: auto; margin: 0; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }

    /* ── Right content pane ── */
    .content-pane { flex: 1; min-width: 0; overflow-y: auto; padding: 16px; }

    /* ── Full-screen pane (form) ── */
    .full-pane { flex: 1; overflow-y: auto; padding: 16px; }
    .full-pane-inner { max-width: 640px; margin: 0 auto; }

    /* ── Search row ── */
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    .search-input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 0.9rem; background: var(--card);
      outline: none; font-family: inherit; color: var(--text);
    }
    .search-input:focus { border-color: var(--accent); }
    select.sort-select {
      width: auto; border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 8px;
      font-size: 0.8rem; background: var(--card); color: var(--text);
      outline: none; font-family: inherit; cursor: pointer; flex-shrink: 0;
    }

    /* ── Recipe cards ── */
    .recipe-grid { display: flex; flex-direction: column; gap: 8px; }
    .recipe-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
      box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 10px;
    }
    .recipe-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .recipe-card-body { flex: 1; min-width: 0; }
    .recipe-card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .recipe-card-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 999px;
      font-size: 0.7rem; font-weight: 700; color: white;
    }
    .badge-easy   { background: var(--green); }
    .badge-medium { background: var(--amber); }
    .badge-hard   { background: var(--red); }
    .badge-cat    { background: #6366f1; }
    .meta-text { font-size: 0.78rem; color: var(--muted); }
    .stars { color: #f59e0b; font-size: 0.82rem; letter-spacing: -.05em; }

    /* ── Heart button ── */
    .heart-btn {
      background: none; border: none; font-size: 1.15rem; line-height: 1;
      cursor: pointer; padding: 4px 3px; border-radius: 6px; flex-shrink: 0;
      color: #d1d5db; transition: color .12s, background .12s;
    }
    .heart-btn:hover { color: #f43f5e; background: #fff1f2; }
    .heart-btn.on { color: #f43f5e; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 24px; right: 24px;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent); color: var(--accent-fg);
      border: none; font-size: 1.5rem; cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.2); transition: background .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .fab:hover { background: var(--accent-hover); transform: scale(1.05); }

    /* ── Detail view ── */
    .detail-topbar {
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .detail-title { font-size: 1.3rem; font-weight: 700; flex: 1; }
    .detail-actions { display: flex; gap: 6px; }
    .detail-meta-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 16px; }
    .detail-section { margin-top: 20px; }
    .detail-section h3 {
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px;
    }
    .ingredient-list { list-style: none; }
    .ingredient-list li {
      padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem;
    }
    .ingredient-list li:last-child { border-bottom: none; }
    .source-link { font-size: 0.85rem; color: #2563eb; word-break: break-all; }
    .notes-text { font-size: 0.9rem; color: var(--muted); font-style: italic; white-space: pre-wrap; }
    .steps-text { font-size: 0.92rem; white-space: pre-wrap; line-height: 1.65; }
    .detail-footer {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px;
      padding-top: 16px; border-top: 1px solid var(--border);
    }

    /* ── Buttons ── */
    .btn {
      padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; border: none; transition: all .15s; font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .45; cursor: default; }
    .btn-amber { background: var(--amber-bg); color: #92400e; border: 1.5px solid var(--amber-border); }
    .btn-amber:hover { background: #fef3c7; }
    .btn-ghost { background: none; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1.5px solid #fecaca; }
    .btn-danger:hover { background: #fee2e2; }
    .back-btn {
      background: none; border: none; color: var(--muted); font-size: 1.1rem;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1; display: none;
    }
    .back-btn:hover { background: var(--border); color: var(--text); }

    /* ── Form ── */
    .form-topbar {
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    }
    .form-back {
      background: none; border: none; color: var(--muted); font-size: 1.1rem;
      cursor: pointer; padding: 4px 6px; border-radius: 6px; line-height: 1;
    }
    .form-back:hover { background: var(--border); color: var(--text); }
    .form-title { font-size: 1.1rem; font-weight: 700; }
    .form-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; box-shadow: var(--shadow);
    }
    .field { margin-bottom: 14px; }
    label {
      display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted);
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em;
    }
    input[type=text], input[type=number], textarea, select {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 0.92rem; font-family: inherit; color: var(--text);
      background: var(--card); outline: none; transition: border-color .15s;
    }
    input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 72px; }
    textarea.tall { min-height: 160px; }
    .difficulty-group { display: flex; gap: 8px; }
    .diff-btn {
      flex: 1; padding: 7px; border-radius: 8px; border: 1.5px solid var(--border);
      background: var(--card); font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: all .15s; font-family: inherit; color: var(--muted);
    }
    .diff-btn.easy.active  { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .diff-btn.medium.active { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
    .diff-btn.hard.active  { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
    .stars-input { display: flex; gap: 4px; }
    .star-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #d1d5db; padding: 0 2px; transition: color .1s; }
    .star-btn.on { color: #f59e0b; }
    .row-del { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 8px 6px; border-radius: 6px; flex-shrink: 0; }
    .row-del:hover { background: var(--red-bg); color: var(--red); }
    .form-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: #f9fafb; padding: 10px 18px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.3);
      z-index: 200; pointer-events: none; opacity: 0; transition: opacity .2s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #7f1d1d; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal {
      background: var(--card); border-radius: 12px; padding: 20px;
      width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

    /* ── Empty / loading ── */
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 10px; }
    .loading { text-align: center; padding: 48px; color: var(--muted); }

    /* ── Mobile ── */
    @media (max-width: 580px) {
      .layout { flex-direction: column; }
      .nav-pane {
        width: 100%; height: auto; flex-direction: row; flex-shrink: 0;
        overflow-x: auto; overflow-y: hidden;
        border-right: none; border-bottom: 1px solid var(--border);
        padding: 8px; gap: 5px;
      }
      .nav-section, .nav-divider { display: none; }
      .nav-item {
        width: auto; flex-shrink: 0; white-space: nowrap;
        padding: 5px 12px; border-radius: 999px;
        border: 1.5px solid var(--border);
        font-size: 0.82rem;
      }
      .nav-item.active {
        background: var(--accent); color: var(--accent-fg);
        border-color: var(--accent); font-weight: 600;
      }
      .nav-item:hover { background: var(--border); }
      .nav-item.active:hover { background: var(--accent-hover); }
      .layout.detail-mode .nav-pane { display: none; }
      .back-btn { display: block; }
      .fab { bottom: 16px; right: 16px; }
      .nav-section-row, .cat-inline-form { display: none; }
      .nav-cat-del { opacity: 1; }
    }
  </style>
  <base href="/run/recipes/">
</head>
<body>
<div id="layout" class="layout"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { esc, hubConfirm, crossWrite, isAdult, createShareHelper, searchMatch } from "/hub-sdk.js";
import { formatTime, difficultyLabel, starDisplay, sortRecipes, searchableFields } from "./logic.js";

const DB    = window.__DB_URL         ?? "";
const STORE = window.__STORE_URL      ?? "";
const ME    = window.__CURRENT_MEMBER ?? null;
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);

// Neutralize DB-derived ids before interpolating into inline on* handlers: any
// member can INSERT a row with an attacker-chosen id via raw /api/db, and HTML
// escaping does not protect a JS-string context inside an attribute (entities are
// decoded before the JS parses). Legit ids are UUIDs/hex, so restricting to
// [A-Za-z0-9_-] is lossless and closes the injection.
const sid = v => String(v ?? "").replace(/[^A-Za-z0-9_-]/g, "");

// ── State ─────────────────────────────────────────────────────────────────────
let view      = "browse"; // "browse" | "form"
let rightView = "list";   // "list"   | "detail"  (only when view="browse")

let recipes = [], categories = [], categoryMap = new Map();
let currentRecipe = null;
let editingId     = null;
let navFilter     = "all"; // "all" | "top_rated" | "favorites" | "cat:{id}" | "uncategorized"
let searchQ       = "";
let sortBy        = "title"; // "title" | "time"

let formDifficulty = "medium";
let formRating     = 0;
let showCatForm    = false;
let shareOpen      = false; // share modal for currentRecipe
let shareLinks     = [];    // active links for currentRecipe (from api/share/list)
let shareBusy      = false;
let formFields     = { title:"", description:"", category_ids:[], servings:"4", total_time_mins:"", source:"", ings:"", steps:"", notes:"" };

function captureFormFields() {
  if (view !== "form") return;
  formFields = {
    title:         document.getElementById("f-title")?.value    ?? formFields.title,
    description:   document.getElementById("f-desc")?.value     ?? formFields.description,
    category_ids:  Array.from(document.querySelectorAll('input[name="f-cats"]:checked')).map(el => el.value),
    servings:      document.getElementById("f-servings")?.value ?? formFields.servings,
    total_time_mins: document.getElementById("f-time")?.value   ?? formFields.total_time_mins,
    source:        document.getElementById("f-source")?.value   ?? formFields.source,
    ings:          document.getElementById("f-ings")?.value     ?? formFields.ings,
    steps:         document.getElementById("f-steps")?.value    ?? formFields.steps,
    notes:         document.getElementById("f-notes")?.value    ?? formFields.notes,
  };
}

// ── DB ────────────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ── Data loading ──────────────────────────────────────────────────────────────
async function loadAll() {
  const [rRes, cRes, rcRes] = await Promise.all([
    db(`SELECT * FROM app_recipes__recipes ORDER BY title`),
    db(`SELECT * FROM app_recipes__categories ORDER BY name`),
    db(`SELECT recipe_id, category_id FROM app_recipes__recipe_categories`),
  ]);
  categories = cRes.rows;
  categoryMap = new Map(categories.map(c => [c.id, c]));
  const rcMap = {};
  for (const rc of rcRes.rows) {
    (rcMap[rc.recipe_id] ??= []).push(rc.category_id);
  }
  recipes = rRes.rows.map(r => ({ ...r, category_ids: rcMap[r.id] ?? [] }));
}

async function loadRecipeFull(id) {
  const [rRes, rcRes] = await Promise.all([
    db(`SELECT * FROM app_recipes__recipes WHERE id = ?`, [id]),
    db(`SELECT category_id FROM app_recipes__recipe_categories WHERE recipe_id = ?`, [id]),
  ]);
  if (!rRes.rows[0]) return null;
  return { ...rRes.rows[0], category_ids: rcRes.rows.map(r => r.category_id) };
}

// ── Filtered recipe list ──────────────────────────────────────────────────────
function getFiltered() {
  let list = [...recipes];

  if      (navFilter === "top_rated")     list = list.filter(r => r.rating);
  else if (navFilter === "favorites")     list = list.filter(r => !!r.is_favorite);
  else if (navFilter === "uncategorized") list = list.filter(r => !r.category_ids?.length);
  else if (navFilter.startsWith("cat:")) {
    const catId = navFilter.slice(4);
    list = list.filter(r => r.category_ids?.includes(catId));
  }

  if (searchQ) {
    list = list.filter(r => searchMatch(
      searchQ,
      searchableFields(r, (r.category_ids ?? []).map(id => categoryMap.get(id)?.name)),
    ));
  }

  if (navFilter === "top_rated") {
    list.sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0) || a.title.localeCompare(b.title));
  } else {
    list = sortRecipes(list, sortBy);
  }

  return list;
}

// ── KV export sync ────────────────────────────────────────────────────────────
async function syncExport() {
  if (!STORE) return;
  try {
    const exported = recipes.map(r => ({
      id: r.id, title: r.title, category_ids: r.category_ids ?? [],
      difficulty: r.difficulty, servings: r.servings,
      total_time_mins: r.total_time_mins, rating: r.rating,
      ingredients_text: r.ingredients_text ?? "",
    }));
    await fetch(STORE, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: "recipes", value: JSON.stringify(exported) }),
    });
  } catch { /* non-fatal */ }
}

// ── Grocery integration ───────────────────────────────────────────────────────
async function addToGrocery(recipe) {
  const items = (recipe.ingredients_text ?? "").split("\n").map(s => s.trim()).filter(Boolean);
  if (!items.length) { showToast("No ingredients to add", "error"); return; }
  const ops = items.map(name => ({
    op: "array_append", path: "items",
    value: { name, addedBy: recipe.title },
  }));
  try {
    await crossWrite("grocery", "pending_items", ops);
    showToast(`${items.length} item${items.length !== 1 ? "s" : ""} added to grocery list`);
  } catch {
    showToast("Grocery app not available", "error");
  }
}

// ── Category CRUD ─────────────────────────────────────────────────────────────
window.toggleCatForm = function() {
  showCatForm = !showCatForm;
  render();
  if (showCatForm) setTimeout(() => document.getElementById("new-cat-name")?.focus(), 0);
};

window.addCatInline = async function() {
  const nameEl  = document.getElementById("new-cat-name");
  const colorEl = document.getElementById("new-cat-color");
  const name = nameEl?.value.trim();
  if (!name) { nameEl?.focus(); return; }
  const id = crypto.randomUUID();
  const color = colorEl?.value ?? "#6366f1";
  const created_at = new Date().toISOString();

  // Optimistic update — add locally and render immediately
  const newCat = { id, name, color, created_at };
  categories.push(newCat);
  categories.sort((a, b) => a.name.localeCompare(b.name));
  categoryMap.set(id, newCat);
  showCatForm = false;
  render();
  showToast(`"${name}" added`);

  // Persist in the background
  try {
    await db(`INSERT INTO app_recipes__categories (id, name, color, created_at) VALUES (?, ?, ?, ?)`,
      [id, name, color, created_at]);
  } catch {
    showToast("Failed to save category", "error");
    await loadAll();
    render();
  }
};

window.deleteCatInline = async function(id) {
  const name = categoryMap.get(id)?.name ?? "this category";
  if (!await hubConfirm({ message: `Delete "${name}"?`, confirmLabel: "Delete", destructive: true })) return;
  await Promise.all([
    db(`DELETE FROM app_recipes__categories WHERE id = ?`, [id]),
    db(`DELETE FROM app_recipes__recipe_categories WHERE category_id = ?`, [id]),
  ]);
  if (navFilter === "cat:" + id) navFilter = "all";
  await loadAll();
  render();
};

// ── Favorite toggle ───────────────────────────────────────────────────────────
async function toggleFavorite(id, currentVal) {
  const newVal = currentVal ? 0 : 1;
  await db(`UPDATE app_recipes__recipes SET is_favorite = ? WHERE id = ?`, [newVal, id]);
  const r = recipes.find(r => r.id === id);
  if (r) r.is_favorite = newVal;
  if (currentRecipe?.id === id) currentRecipe.is_favorite = newVal;
  render();
}

// ── Recipe CRUD ───────────────────────────────────────────────────────────────
async function saveRecipe() {
  captureFormFields();
  const title = document.getElementById("f-title")?.value.trim();
  if (!title) { document.getElementById("f-title")?.focus(); return; }

  const now = new Date().toISOString();
  const catIds = formFields.category_ids;
  const data = {
    title,
    description:      document.getElementById("f-desc")?.value.trim()  ?? "",
    difficulty:       formDifficulty,
    servings:         parseInt(document.getElementById("f-servings")?.value) || 4,
    total_time_mins:  parseInt(document.getElementById("f-time")?.value)     || null,
    source:           document.getElementById("f-source")?.value.trim() ?? "",
    rating:           formRating || null,
    ingredients_text: document.getElementById("f-ings")?.value          ?? "",
    steps_text:       document.getElementById("f-steps")?.value         ?? "",
    notes:            document.getElementById("f-notes")?.value.trim()  ?? "",
  };

  const isNew   = !editingId;
  const recipeId = editingId ?? crypto.randomUUID();

  // Optimistic update — patch local state and navigate immediately
  const optimisticRecipe = {
    ...data, id: recipeId, category_ids: catIds,
    is_favorite: isNew ? 0 : (recipes.find(r => r.id === recipeId)?.is_favorite ?? 0),
    created_by_id: ME?.id ?? "demo", created_by_name: ME?.name ?? "Demo",
    created_at: isNew ? now : (recipes.find(r => r.id === recipeId)?.created_at ?? now),
    updated_at: now,
  };
  if (isNew) {
    recipes.push(optimisticRecipe);
  } else {
    const idx = recipes.findIndex(r => r.id === recipeId);
    if (idx !== -1) recipes[idx] = optimisticRecipe;
  }
  currentRecipe = optimisticRecipe;
  editingId     = recipeId;
  view = "browse"; rightView = "detail";
  render();

  // Persist in the background
  try {
    if (!isNew) {
      await db(
        `UPDATE app_recipes__recipes SET title=?,description=?,difficulty=?,servings=?,total_time_mins=?,source=?,rating=?,ingredients_text=?,steps_text=?,notes=?,updated_at=? WHERE id=?`,
        [data.title, data.description, data.difficulty, data.servings,
         data.total_time_mins, data.source, data.rating, data.ingredients_text,
         data.steps_text, data.notes, now, recipeId]);
      await db(`DELETE FROM app_recipes__recipe_categories WHERE recipe_id = ?`, [recipeId]);
    } else {
      const who     = ME?.id   ?? "demo";
      const whoName = ME?.name ?? "Demo";
      await db(
        `INSERT INTO app_recipes__recipes (id,title,description,difficulty,servings,total_time_mins,source,rating,ingredients_text,steps_text,notes,is_favorite,created_by_id,created_by_name,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,0,?,?,?,?)`,
        [recipeId, data.title, data.description, data.difficulty,
         data.servings, data.total_time_mins, data.source, data.rating,
         data.ingredients_text, data.steps_text, data.notes, who, whoName, now, now]);
    }

    for (const catId of catIds) {
      await db(`INSERT INTO app_recipes__recipe_categories (recipe_id, category_id) VALUES (?, ?)`, [recipeId, catId]);
    }

    await Promise.all([loadAll(), syncExport()]);
    currentRecipe = recipes.find(r => r.id === recipeId) ?? currentRecipe;
    render();
  } catch {
    showToast("Save failed — changes may not have been saved", "error");
    await loadAll();
    currentRecipe = recipes.find(r => r.id === recipeId) ?? null;
    render();
  }
}

async function deleteRecipe(id) {
  if (!await hubConfirm({ message: "Delete this recipe?", confirmLabel: "Delete", destructive: true })) return;
  await db(`DELETE FROM app_recipes__recipe_categories WHERE recipe_id = ?`, [id]);
  await db(`DELETE FROM app_recipes__recipes WHERE id = ?`, [id]);
  await Promise.all([loadAll(), syncExport()]);
  currentRecipe = null;
  rightView = "list";
  render();
}

// ── HTML builders ─────────────────────────────────────────────────────────────

      <button class="nav-item${navFilter === "cat:" + c.id ? " active" : ""}" onclick="setNav('cat:${sid(c.id)}')" title="${esc(c.name)}">
        <span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}
      </button>
      <button class="nav-cat-del" onclick="deleteCatInline('${sid(c.id)}')" title="Delete">×</button>
    </div>`).join("");

  const catForm = showCatForm ? `
    <div class="cat-inline-form">
      <input id="new-cat-name" class="cat-inline-input" type="text" placeholder="Category name"
        onkeydown="if(event.key==='Enter')addCatInline()" />
      <div class="cat-inline-row">
        <input id="new-cat-color" type="color" value="#6366f1"
          style="width:30px;height:28px;border:1px solid var(--border);border-radius:5px;cursor:pointer;flex-shrink:0;padding:1px" />

        <button onclick="toggleCatForm()" class="btn btn-ghost" style="padding:5px 9px;font-size:0.85rem">✕</button>
      </div>

  return `
    ${item("all",       "All Recipes")}
    ${item("top_rated", "Top Rated")}
    ${item("favorites", "Favorites")}
    <div class="nav-divider"></div>
    <div class="nav-section-row">Categories <button class="nav-add-btn" onclick="toggleCatForm()" title="Add category">+</button></div>

function listHtml() {

      <option value="title"${sortBy === "title" ? " selected" : ""}>A–Z</option>
      <option value="time"${sortBy  === "time"  ? " selected" : ""}>Quickest</option>
    </select>` : "";

  const cards = filtered.length ? filtered.map(r => {
    const cats = (r.category_ids ?? []).map(id => categoryMap.get(id)).filter(Boolean);
    const fav = !!r.is_favorite;
    return `
      <div class="recipe-card" onclick="openDetail('${sid(r.id)}')">
        <div class="recipe-card-body">
          <div class="recipe-card-title">${esc(r.title)}</div>
          <div class="recipe-card-meta">
            <span class="badge badge-${r.difficulty}">${difficultyLabel(r.difficulty)}</span>
            ${cats.map(cat => `<span class="badge badge-cat" style="background:${esc(cat.color)}">${esc(cat.name)}</span>`).join("")}
            ${r.total_time_mins ? `<span class="meta-text">⏱ ${formatTime(r.total_time_mins)}</span>` : ""}
            ${r.servings        ? `<span class="meta-text">👥 ${r.servings}</span>` : ""}
            ${r.rating          ? `<span class="stars">${starDisplay(r.rating)}</span>` : ""}
          </div>
        </div>
        <button class="heart-btn${fav ? " on" : ""}" title="${fav ? "Remove from favorites" : "Add to favorites"}"
          onclick="event.stopPropagation();doToggleFav('${sid(r.id)}',${fav ? 1 : 0})">♥</button>
      </div>`;
  }).join("") : `
    <div class="empty">
      <div class="empty-icon">📖</div>
      <p>${searchQ ? "No recipes match your search." : navFilter === "favorites" ? "No favorites yet — click ♥ on a recipe." : "No recipes here yet."}</p>
    </div>`;

  return `
    <div class="search-row">
      <input class="search-input" type="text" placeholder="Search recipes…"
        value="${esc(searchQ)}" oninput="setSearch(this.value)" autocomplete="off" />
      ${sortSelect}
    </div>
    <div class="recipe-grid">${cards}</div>

function detailHtml() {
  const r = currentRecipe;

  const cats  = (r.category_ids ?? []).map(id => categoryMap.get(id)).filter(Boolean);
  const isUrl = r.source?.startsWith("http");
  const fav   = !!r.is_favorite;
  const ingredientLines = (r.ingredients_text ?? "").split("\n").map(s => s.trim()).filter(Boolean);
  const hasIngredients  = ingredientLines.length > 0;
  const hasSteps        = (r.steps_text ?? "").trim().length > 0;

  return `
    <div class="detail-topbar">
      <button class="back-btn" onclick="goList()">←</button>
      <span class="detail-title">${esc(r.title)}</span>
      <div class="detail-actions">
        <button class="heart-btn${fav ? " on" : ""}" title="${fav ? "Remove from favorites" : "Add to favorites"}"
          style="font-size:1.3rem;padding:6px 5px"
          onclick="doToggleFav('${sid(r.id)}',${fav ? 1 : 0})">♥</button>
        ${share.enabled && isAdult(ME) ? `<button class="btn btn-ghost" onclick="openShare()">Share</button>` : ""}
        <button class="btn btn-ghost" onclick="openEdit('${sid(r.id)}')">Edit</button>
        <button class="btn btn-danger" onclick="doDelete('${sid(r.id)}')">Delete</button>
      </div>
    </div>

    <div class="detail-meta-row">
      <span class="badge badge-${r.difficulty}">${difficultyLabel(r.difficulty)}</span>
      ${cats.map(cat => `<span class="badge badge-cat" style="background:${esc(cat.color)}">${esc(cat.name)}</span>`).join("")}
      ${r.total_time_mins ? `<span class="meta-text">⏱ ${formatTime(r.total_time_mins)}</span>` : ""}
      ${r.servings        ? `<span class="meta-text">👥 ${r.servings} servings</span>` : ""}
      ${r.rating          ? `<span class="stars" title="${r.rating}/5 stars">${starDisplay(r.rating)}</span>` : ""}
    </div>

    ${r.description ? `<p style="font-size:0.92rem;color:var(--muted);margin-bottom:8px">${esc(r.description)}</p>` : ""}
    ${r.source      ? `<p><a class="source-link" href="${isUrl ? esc(r.source) : "#"}" ${isUrl ? 'target="_blank" rel="noopener"' : ""}>${esc(r.source)}</a></p>` : ""}

    ${hasIngredients ? `
      <div class="detail-section">
        <h3>Ingredients</h3>
        <ul class="ingredient-list">
          ${ingredientLines.map(line => `<li>${esc(line)}</li>`).join("")}
        </ul>
      </div>` : ""}

    ${hasSteps ? `
      <div class="detail-section">
        <h3>Steps</h3>
        <p class="steps-text">${esc(r.steps_text)}</p>
      </div>` : ""}

    ${r.notes ? `
      <div class="detail-section">
        <h3>Notes</h3>
        <p class="notes-text">${esc(r.notes)}</p>
      </div>` : ""}

    <div class="detail-footer">
      ${hasIngredients ? `<button class="btn btn-amber" id="grocery-btn" onclick="doAddToGrocery()">🛒 Add to Grocery</button>` : ""}
    </div>`;
}

function shareModalHtml() {
  const r = currentRecipe;
  if (!r) return "";
  const active = shareLinks.filter(l => l.itemId === r.id && !l.revokedAt && new Date(l.expiresAt) > new Date());
  const rows = active.map(l => `
    <div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <input readonly value="${esc(l.url)}" onclick="this.select()"
          style="width:100%;font-size:0.8rem;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg)" />
        <div style="font-size:0.75rem;color:var(--muted);margin-top:3px">
          Expires ${new Date(l.expiresAt).toLocaleDateString()} · ${l.viewCount} view${l.viewCount === 1 ? "" : "s"}
        </div>
      </div>
      <button class="btn btn-ghost" style="padding:4px 8px;font-size:0.8rem" onclick="doCopyShare('${sid(l.id)}')">Copy</button>
      <button class="btn btn-danger" style="padding:4px 8px;font-size:0.8rem" onclick="doRevokeShare('${sid(l.id)}')">Revoke</button>
    </div>`).join("");

  return `
    <div class="modal-backdrop" onclick="if(event.target===this)closeShare()">
      <div class="modal">
        <h3>Share “${esc(r.title)}”</h3>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:10px">
          Anyone with the link can view this recipe — no account needed. Links expire automatically.
        </p>
        ${rows || `<p style="font-size:0.85rem;color:var(--muted);padding:8px 0">No active links yet.</p>`}
        <div style="display:flex;gap:8px;align-items:center;margin-top:14px">
          <select id="share-expiry" style="padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:0.85rem">
            <option value="24">1 day</option>
            <option value="168" selected>7 days</option>
            <option value="720">30 days</option>
          </select>
          <button class="btn btn-amber" ${shareBusy ? "disabled" : ""} onclick="doCreateShare()">
            ${shareBusy ? "Creating…" : "Create link"}
          </button>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeShare()">Close</button>
        </div>
      </div>
    </div>`;
}

function formHtml() {
  const editing = !!editingId;

  const catChecks = categories.length ? categories.map(c => `
    <label class="cat-check-label">
      <input type="checkbox" name="f-cats" value="${esc(c.id)}"
        ${formFields.category_ids.includes(c.id) ? "checked" : ""} />
      <span class="cat-dot" style="background:${esc(c.color)}"></span>
      ${esc(c.name)}
    </label>`).join("") :
    `<p style="font-size:0.85rem;color:var(--muted);padding:4px 0">No categories yet — add one in the sidebar.</p>`;

  const starsHtml = [1,2,3,4,5].map(n =>
    `<button class="star-btn${formRating >= n ? " on" : ""}" onclick="setRating(${n})">★</button>`
  ).join("");

  return `
    <div class="form-topbar">
      <button class="form-back" onclick="cancelForm()">←</button>
      <span class="form-title">${editing ? "Edit Recipe" : "New Recipe"}</span>
    </div>
    <div class="form-card">
      <div class="field">
        <label>Title *</label>
        <input id="f-title" type="text" placeholder="Recipe title" value="${esc(formFields.title)}" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f-desc" placeholder="A brief description…">${esc(formFields.description)}</textarea>
      </div>
      <div class="field">
        <label>Categories</label>
        <div class="cat-checkboxes">${catChecks}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:110px">
          <label>Servings</label>
          <input id="f-servings" type="number" min="1" value="${esc(formFields.servings)}" />
        </div>
        <div class="field" style="flex:1;min-width:110px">
          <label>Time (min)</label>
          <input id="f-time" type="number" min="1" placeholder="e.g. 45" value="${esc(formFields.total_time_mins)}" />
        </div>
      </div>
      <div class="field">
        <label>Difficulty</label>
        <div class="difficulty-group">
          ${["easy","medium","hard"].map(d =>
            `<button class="diff-btn ${d}${formDifficulty === d ? " active" : ""}" onclick="setDiff('${d}')">${difficultyLabel(d)}</button>`
          ).join("")}
        </div>
      </div>
      <div class="field">
        <label>Rating</label>
        <div class="stars-input">
          ${starsHtml}
          <button class="row-del" onclick="setRating(0)" title="Clear rating" style="font-size:0.8rem">✕</button>
        </div>
      </div>
      <div class="field">
        <label>Source</label>
        <input id="f-source" type="text" placeholder="URL or book name" value="${esc(formFields.source)}" />
      </div>
      <div class="field">
        <label>Ingredients — one per line</label>
        <textarea id="f-ings" class="tall"
          placeholder="2 cups flour&#10;1 tsp salt&#10;3 eggs">${esc(formFields.ings)}</textarea>
      </div>
      <div class="field">
        <label>Steps</label>
        <textarea id="f-steps" class="tall" placeholder="Write out the steps…">${esc(formFields.steps)}</textarea>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" placeholder="Tips, variations, substitutions…">${esc(formFields.notes)}</textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="cancelForm()">Cancel</button>
        <button class="btn btn-primary" onclick="doSave()">Save</button>
      </div>
    </div>`;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const el = document.getElementById("layout");
  if (!el) return;

  if (view === "form") {
    el.className = "layout";
    el.innerHTML = `<div class="full-pane"><div class="full-pane-inner">${formHtml()}</div></div>`;
    return;
  }

  const inDetail = rightView === "detail" && !!currentRecipe;
  el.className = `layout${inDetail ? " detail-mode" : ""}`;
  el.innerHTML = `
    <nav class="nav-pane">${navHtml()}</nav>
    <div class="content-pane">${inDetail ? detailHtml() : listHtml()}</div>
    ${inDetail && shareOpen ? shareModalHtml() : ""}
  `;
}

// ── Window globals ────────────────────────────────────────────────────────────
window.openDetail = async function(id) {
  currentRecipe = await loadRecipeFull(id);
  rightView = "detail"; shareOpen = false; render();
};
window.goList = function() {
  rightView = "list"; shareOpen = false; render();
};
window.openForm = function() {
  editingId = null; currentRecipe = null;
  formDifficulty = "medium"; formRating = 0;
  formFields = { title:"", description:"", category_ids:[], servings:"4", total_time_mins:"", source:"", ings:"", steps:"", notes:"" };
  view = "form"; render();
  setTimeout(() => document.getElementById("f-title")?.focus(), 0);
};
window.openEdit = async function(id) {
  currentRecipe  = await loadRecipeFull(id);
  editingId      = id;
  formDifficulty = currentRecipe.difficulty ?? "medium";
  formRating     = currentRecipe.rating ?? 0;
  formFields = {
    title:           currentRecipe.title            ?? "",
    description:     currentRecipe.description      ?? "",
    category_ids:    currentRecipe.category_ids     ?? [],
    servings:        String(currentRecipe.servings   ?? 4),
    total_time_mins: String(currentRecipe.total_time_mins ?? ""),
    source:          currentRecipe.source            ?? "",
    ings:            currentRecipe.ingredients_text  ?? "",
    steps:           currentRecipe.steps_text        ?? "",
    notes:           currentRecipe.notes             ?? "",
  };
  view = "form"; render();
  setTimeout(() => document.getElementById("f-title")?.focus(), 0);
};
window.cancelForm = function() {
  view = "browse";
  render();
};
window.doSave          = saveRecipe;
window.doDelete        = id => deleteRecipe(id);
window.doToggleFav     = (id, cur) => toggleFavorite(id, cur);
window.doAddToGrocery  = async function() {
  const btn = document.getElementById("grocery-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Adding…"; }
  await addToGrocery(currentRecipe);
  if (btn) { btn.disabled = false; btn.textContent = "🛒 Add to Grocery"; }
};
window.openShare = async function() {
  shareOpen = true; shareBusy = false;
  shareLinks = await share.list();
  render();
};
window.closeShare = function() {
  shareOpen = false; render();
};
window.doCreateShare = async function() {
  const hours = Number(document.getElementById("share-expiry")?.value) || undefined;
  shareBusy = true; render();
  try {
    const link = await share.create("recipe", currentRecipe.id, { expiresInHours: hours, label: currentRecipe.title });
    shareLinks = await share.list();
    shareBusy = false; render();
    try { await navigator.clipboard.writeText(link.url); showToast("Link created and copied"); }
    catch { showToast("Link created"); }
  } catch (err) {
    shareBusy = false; render();
    showToast(err.message, "error");
  }
};
window.doCopyShare = async function(id) {
  const link = shareLinks.find(l => l.id === id);
  if (!link) return;
  try { await navigator.clipboard.writeText(link.url); showToast("Link copied"); }
  catch { showToast("Couldn't copy — select the link text instead", "error"); }
};
window.doRevokeShare = async function(id) {
  if (!await hubConfirm("Revoke this share link?", { description: "Anyone using it will immediately lose access.", confirmLabel: "Revoke" })) return;
  try {
    await share.revoke(id);
    shareLinks = await share.list();
    render();
    showToast("Link revoked");
  } catch (err) {
    showToast(err.message, "error");
  }
};
window.setNav     = f  => { navFilter = f; rightView = "list"; render(); };
window.setSearch  = q  => { searchQ  = q; render(); };
window.setSortBy  = s  => { sortBy   = s; render(); };
window.setDiff    = d  => { captureFormFields(); formDifficulty = d; render(); };
window.setRating  = n  => { captureFormFields(); formRating = formRating === n ? 0 : n; render(); };

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast${type ? " " + type : ""} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast"; }, 3000);
}

// ── Deep link ─────────────────────────────────────────────────────────────────
function handleDeepLink() {
  const recipeId = new URLSearchParams(window.location.search).get("recipeId");
  if (!recipeId) return;
  window.openDetail(recipeId);
}

(async () => {
  if (!DB) {
    recipes = [
      { id:"demo-1", title:"Spaghetti Bolognese", difficulty:"medium", servings:4, total_time_mins:60, rating:5, category_id:null, is_favorite:0 },

      { id:"demo-3", title:"Chicken Tikka Masala",difficulty:"hard",   servings:4, total_time_mins:90, rating:5, category_id:null, is_favorite:0 },
    ];
  } else {
    await loadAll();
    syncExport();

  handleDeepLink();
})();
